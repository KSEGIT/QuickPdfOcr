<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Primary brand gradient: indigo (top-left) to violet (bottom-right) -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <!-- Very subtle radial lightening toward the top -->
    <radialGradient id="topLight" cx="0.5" cy="0.08" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Translucent cyan wash above the scan beam -->
    <linearGradient id="washGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.16"/>
    </linearGradient>
    <!-- Soft shadow under the document -->
    <filter id="docShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <!-- Document silhouette, used to clip the cyan wash to the page -->
    <clipPath id="docClip">
      <path d="M 328 232 L 622 232 L 732 342 L 732 756 Q 732 792 696 792 L 328 792 Q 292 792 292 756 L 292 268 Q 292 232 328 232 Z"/>
    </clipPath>
  </defs>

  <!-- Squircle background (~22.5% corner radius) -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#topLight)"/>

  <!-- Document soft shadow (same silhouette, offset down, so the fold notch stays clean) -->
  <path d="M 328 232 L 622 232 L 732 342 L 732 756 Q 732 792 696 792 L 328 792 Q 292 792 292 756 L 292 268 Q 292 232 328 232 Z" fill="#1E1B4B" opacity="0.30" filter="url(#docShadow)" transform="translate(8 20)"/>

  <!-- White document page with folded top-right corner -->
  <path d="M 328 232 L 622 232 L 732 342 L 732 756 Q 732 792 696 792 L 328 792 Q 292 792 292 756 L 292 268 Q 292 232 328 232 Z" fill="#FFFFFF"/>
  <!-- Fold flap -->
  <path d="M 622 232 L 622 306 Q 622 342 658 342 L 732 342 Z" fill="#CBD5E1"/>

  <!-- Faint cyan wash above the beam (clipped to the page) -->
  <rect x="292" y="232" width="440" height="272" fill="url(#washGrad)" clip-path="url(#docClip)"/>

  <!-- Text lines (slate gray) -->
  <g fill="#475569">
    <rect x="352" y="300" width="248" height="28" rx="14"/>
    <rect x="352" y="400" width="320" height="26" rx="13"/>
    <rect x="352" y="470" width="320" height="26" rx="13"/>
    <rect x="352" y="550" width="320" height="26" rx="13"/>
    <rect x="352" y="620" width="320" height="26" rx="13"/>
    <rect x="352" y="690" width="228" height="26" rx="13"/>
  </g>

  <!-- Glowing scan beam: soft halo, mid glow, bright core, hot center -->
  <rect x="232" y="472" width="560" height="80" rx="40" fill="#22D3EE" opacity="0.15"/>
  <rect x="246" y="488" width="532" height="48" rx="24" fill="#22D3EE" opacity="0.30"/>
  <rect x="262" y="504" width="500" height="16" rx="8" fill="#22D3EE"/>
  <rect x="262" y="509" width="500" height="6" rx="3" fill="#CFFAFE" opacity="0.95"/>
</svg>
