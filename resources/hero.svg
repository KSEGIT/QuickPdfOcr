<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Backdrop: deep indigo -> violet diagonal -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="55%" stop-color="#3B2E8F"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <!-- Soft radial lightening upper-left -->
    <radialGradient id="sheen" cx="18%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <!-- Ambient glow behind hero card -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <!-- Vignette -->
    <radialGradient id="vig" cx="50%" cy="46%" r="78%">
      <stop offset="0%" stop-color="#0B0620" stop-opacity="0"/>
      <stop offset="70%" stop-color="#0B0620" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0B0620" stop-opacity="0.55"/>
    </radialGradient>
    <!-- Left-third calm dimmer for headline overlay -->
    <linearGradient id="leftdim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F0A2E" stop-opacity="0.34"/>
      <stop offset="30%" stop-color="#0F0A2E" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#0F0A2E" stop-opacity="0"/>
    </linearGradient>
    <!-- Document card face -->
    <linearGradient id="cardface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E6E9F5"/>
    </linearGradient>
    <linearGradient id="ghostface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7D2FE"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>
    <!-- Scan beam -->
    <linearGradient id="beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="42%" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#E0FBFF" stop-opacity="1"/>
      <stop offset="58%" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <!-- Cyan wash above the beam -->
    <linearGradient id="wash" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <!-- Light trail behind the beam -->
    <linearGradient id="trail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.8"/>
    </linearGradient>
    <!-- Text line color -->
    <linearGradient id="linec" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <!-- Dot grid texture -->
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#C4B5FD" opacity="0.16"/>
    </pattern>
    <!-- Glow filter -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="softblur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="cardshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#120A33" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Backdrop -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>
  <rect width="1920" height="1080" fill="url(#sheen)"/>

  <!-- Ambient halo behind hero card -->
  <ellipse cx="1290" cy="560" rx="560" ry="430" fill="url(#halo)" filter="url(#softblur)"/>

  <!-- Ghost card 3 (deepest, top-right) -->
  <g transform="translate(1660,180) rotate(9)" opacity="0.14">
    <rect x="-150" y="-190" width="300" height="380" rx="18" fill="url(#ghostface)"/>
    <rect x="-110" y="-140" width="180" height="14" rx="7" fill="#312E81"/>
    <rect x="-110" y="-104" width="220" height="10" rx="5" fill="#312E81"/>
    <rect x="-110" y="-76" width="150" height="10" rx="5" fill="#312E81"/>
    <rect x="-110" y="-48" width="200" height="10" rx="5" fill="#312E81"/>
    <rect x="-110" y="-20" width="120" height="10" rx="5" fill="#312E81"/>
  </g>

  <!-- Ghost card 2 (mid depth, behind main, lower-left of it) -->
  <g transform="translate(1010,720) rotate(-7)" opacity="0.20">
    <rect x="-170" y="-215" width="340" height="430" rx="20" fill="url(#ghostface)"/>
    <rect x="-125" y="-160" width="200" height="16" rx="8" fill="#312E81"/>
    <rect x="-125" y="-120" width="250" height="11" rx="5.5" fill="#312E81"/>
    <rect x="-125" y="-88" width="170" height="11" rx="5.5" fill="#312E81"/>
    <rect x="-125" y="-56" width="230" height="11" rx="5.5" fill="#312E81"/>
    <rect x="-125" y="-24" width="140" height="11" rx="5.5" fill="#312E81"/>
  </g>

  <!-- Ghost card 1 (nearest ghost, upper-left of main card) -->
  <g transform="translate(1120,300) rotate(5)" opacity="0.26">
    <rect x="-140" y="-180" width="280" height="360" rx="18" fill="url(#ghostface)"/>
    <rect x="-100" y="-130" width="170" height="15" rx="7.5" fill="#312E81"/>
    <rect x="-100" y="-94" width="210" height="10" rx="5" fill="#312E81"/>
    <rect x="-100" y="-66" width="140" height="10" rx="5" fill="#312E81"/>
    <rect x="-100" y="-38" width="190" height="10" rx="5" fill="#312E81"/>
  </g>

  <!-- Main hero document card, slight 3D tilt -->
  <g transform="translate(1360,540) rotate(-4)" filter="url(#cardshadow)">
    <g transform="skewY(-3)">
      <!-- Card edge depth (bottom) -->
      <rect x="-235" y="-300" width="470" height="600" rx="26" fill="#B9C0E8" transform="translate(0,10)" opacity="0.9"/>
      <!-- Card face -->
      <rect x="-235" y="-300" width="470" height="600" rx="26" fill="url(#cardface)"/>
      <!-- Folded corner -->
      <path d="M 235 -300 L 165 -300 L 235 -230 Z" fill="#C9CFEA"/>
      <path d="M 235 -300 L 235 -230 L 165 -300 Z" fill="#F4F6FF"/>
      <!-- Header block -->
      <rect x="-185" y="-242" width="220" height="26" rx="13" fill="#6366F1" opacity="0.85"/>
      <!-- Text lines -->
      <g fill="url(#linec)">
        <rect x="-185" y="-186" width="370" height="16" rx="8"/>
        <rect x="-185" y="-150" width="330" height="16" rx="8"/>
        <rect x="-185" y="-114" width="360" height="16" rx="8"/>
        <rect x="-185" y="-78"  width="280" height="16" rx="8"/>
        <rect x="-185" y="-42"  width="350" height="16" rx="8"/>
        <rect x="-185" y="-6"   width="310" height="16" rx="8"/>
        <rect x="-185" y="30"   width="370" height="16" rx="8"/>
        <rect x="-185" y="66"   width="250" height="16" rx="8"/>
        <rect x="-185" y="102"  width="340" height="16" rx="8"/>
        <rect x="-185" y="138"  width="300" height="16" rx="8"/>
        <rect x="-185" y="174"  width="360" height="16" rx="8"/>
        <rect x="-185" y="210"  width="220" height="16" rx="8"/>
      </g>
      <!-- Cyan wash above the beam -->
      <rect x="-235" y="-160" width="470" height="130" fill="url(#wash)" opacity="0.7"/>
      <!-- Scan beam glow (blurred) -->
      <rect x="-255" y="-52" width="510" height="44" rx="22" fill="#22D3EE" opacity="0.75" filter="url(#glow)"/>
      <!-- Scan beam gradient band -->
      <rect x="-235" y="-40" width="470" height="24" fill="url(#beam)"/>
      <!-- Bright core line -->
      <rect x="-235" y="-31" width="470" height="6" rx="3" fill="#EFFCFF"/>
      <!-- Light trail sweeping off the right edge -->
      <rect x="235" y="-34" width="150" height="12" rx="6" fill="url(#trail)" opacity="0.5" filter="url(#glow)"/>
    </g>
  </g>

  <!-- Small accent sparkle dots near beam -->
  <circle cx="1150" cy="480" r="5" fill="#22D3EE" opacity="0.8" filter="url(#glow)"/>
  <circle cx="1620" cy="600" r="4" fill="#67E8F9" opacity="0.7" filter="url(#glow)"/>
  <circle cx="1560" cy="380" r="3" fill="#A5F3FC" opacity="0.8"/>

  <!-- Left-third dimmer, then vignette -->
  <rect width="1920" height="1080" fill="url(#leftdim)"/>
  <rect width="1920" height="1080" fill="url(#vig)"/>
</svg>
