name: Build Linux

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to build (e.g. v1.0.0)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Build executable
        run: python build.py

      # build.py now produces an onedir bundle (dist/QuickPdfOcr/QuickPdfOcr
      # plus dist/QuickPdfOcr/_internal/), not a single dist/QuickPdfOcr
      # executable -- a onedir binary cannot run without its _internal/
      # sibling, so archive the whole directory as one runnable unit.
      - name: Create tarball
        run: tar -czf dist/QuickPdfOcr-Linux-x86_64.tar.gz -C dist QuickPdfOcr

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickPdfOcr-Linux-x86_64
          path: dist/QuickPdfOcr-Linux-x86_64.tar.gz
          if-no-files-found: error
