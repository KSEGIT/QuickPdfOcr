name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      body: ${{ steps.release.outputs.body }}
    steps:
      # Config lives in release-please-config.json and
      # .release-please-manifest.json at the repo root (the defaults).
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # When a merged release PR makes release-please tag vX.Y.Z, build the
  # binaries and attach them to that release. This goes through
  # workflow_call rather than a push:tags trigger because release-please
  # pushes the tag with GITHUB_TOKEN, and token-created refs do not
  # start new workflow runs.
  create-release:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/create-release.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
      message: ${{ needs.release-please.outputs.body }}
      expect-existing-tag: true
