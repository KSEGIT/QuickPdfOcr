name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. v1.0.0)'
        required: true
        type: string
      message:
        description: 'Release message'
        required: false
        type: string

jobs:
  check-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: meta
        name: Compute tag name
        shell: bash
        run: |
          TAG_NAME="${{ inputs.version }}"
          TAG_NAME="${TAG_NAME//[[:space:]]/}"

          # Normalize common typo: "v.1.2.3" -> "v1.2.3"
          if [[ "$TAG_NAME" =~ ^v\..+ ]]; then
            TAG_NAME="v${TAG_NAME:2}"
          fi

          if [[ ! "$TAG_NAME" =~ ^v ]]; then
            TAG_NAME="v$TAG_NAME"
          fi

          if [[ "$TAG_NAME" == "v" ]]; then
            echo "ERROR: invalid version input: '${{ inputs.version }}'"
            exit 1
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG_NAME"

      - name: Check if tag exists
        shell: bash
        run: |
          TAG_NAME="${{ steps.meta.outputs.tag_name }}"

          # Ensure we can see tags (and fail if the tag already exists on origin).
          git fetch --tags --force
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "ERROR: Tag already exists on origin: $TAG_NAME"
            echo "Use a new version (recommended), or delete the existing tag + release manually."
            exit 1
          fi
          
          echo "Tag $TAG_NAME is available."

  build-windows:
    needs: check-tag
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Tesseract via winget with fallback
        run: |
          Write-Host "Installing Tesseract..."

          $WINGET_TIMEOUT_SECONDS = 180
          $possiblePaths = @(
            "C:\Program Files\Tesseract-OCR",
            "C:\Program Files (x86)\Tesseract-OCR",
            "$env:LOCALAPPDATA\Programs\Tesseract-OCR"
          )

          $tesseractPath = $null
          $installSuccess = $false

          Write-Host "Attempting installation via winget (timeout: $WINGET_TIMEOUT_SECONDS seconds)..."
          try {
            $job = Start-Job -ScriptBlock {
              winget install --id UB-Mannheim.TesseractOCR --disable-interactivity --force --silent --accept-source-agreements --accept-package-agreements 2>&1
            }

            $completed = Wait-Job -Job $job -Timeout $WINGET_TIMEOUT_SECONDS
            if ($completed) {
              Start-Sleep -Seconds 5
              foreach ($path in $possiblePaths) {
                if (Test-Path "$path\tesseract.exe") {
                  Write-Host "✓ Tesseract installed via winget at: $path"
                  $tesseractPath = $path
                  $installSuccess = $true
                  break
                }
              }
            } else {
              Write-Host "⚠️ Winget timed out after $WINGET_TIMEOUT_SECONDS seconds"
              Stop-Job -Job $job
            }

            Remove-Job -Job $job -Force
          } catch {
            Write-Host "⚠️ Winget installation failed: $_"
          }

          if (-not $installSuccess) {
            Write-Host "Falling back to direct download method..."
            $TESSERACT_URL = "https://digi.bib.uni-mannheim.de/tesseract/tesseract-ocr-w64-setup-5.3.3.20231005.exe"
            Invoke-WebRequest -Uri $TESSERACT_URL -OutFile tesseract-installer.exe
            Start-Process -FilePath "tesseract-installer.exe" -ArgumentList "/VERYSILENT", "/NORESTART", "/DIR=C:\Tesseract-OCR" -Wait

            if (Test-Path "C:\Tesseract-OCR\tesseract.exe") {
              $tesseractPath = "C:\Tesseract-OCR"
              $installSuccess = $true
            } else {
              foreach ($path in $possiblePaths) {
                if (Test-Path "$path\tesseract.exe") {
                  $tesseractPath = $path
                  $installSuccess = $true
                  break
                }
              }
            }
          }

          if (-not $installSuccess -or -not $tesseractPath) {
            Write-Error "Failed to install Tesseract via both winget and direct download"
            exit 1
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Build executable
        run: python build.py

      # build.py now produces an onedir bundle (dist/QuickPdfOcr/QuickPdfOcr.exe
      # plus dist/QuickPdfOcr/_internal/), not a single dist/QuickPdfOcr.exe --
      # archive the whole directory so the release asset is one runnable unit.
      - name: Create ZIP archive
        run: Compress-Archive -Path dist\QuickPdfOcr -DestinationPath dist\QuickPdfOcr-Windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickPdfOcr-Windows-x64
          path: dist/QuickPdfOcr-Windows-x64.zip
          if-no-files-found: error

  build-linux:
    needs: check-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Build executable
        run: python build.py

      # build.py now produces an onedir bundle (dist/QuickPdfOcr/QuickPdfOcr
      # plus dist/QuickPdfOcr/_internal/), not a single dist/QuickPdfOcr
      # executable -- a onedir binary cannot run without its _internal/
      # sibling, so archive the whole directory as one runnable unit.
      - name: Create tarball
        run: tar -czf dist/QuickPdfOcr-Linux-x86_64.tar.gz -C dist QuickPdfOcr

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickPdfOcr-Linux-x86_64
          path: dist/QuickPdfOcr-Linux-x86_64.tar.gz
          if-no-files-found: error

  build-macos-arm:
    needs: check-tag
    runs-on: macos-14  # Apple Silicon
    permissions:
      contents: read
    env:
      QUICKPDFOCR_UNIVERSAL2: '1'
    steps:
      - uses: actions/checkout@v4

      # No actions/setup-python here: it provisions Homebrew-style arm64-only
      # interpreters on Apple Silicon runners. PyInstaller freezes the host
      # interpreter into the app, so a thin interpreter produces a thin app
      # no matter what packaging/quickpdfocr.spec's target_arch says.
      # python.org's own macos11.pkg installers are universal2 (arm64 +
      # x86_64) for the duration of a release's bugfix-support window;
      # 3.12.10 is the last 3.12.x release with one -- later 3.12.x releases
      # are source-only security fixes with no macOS installer.
      - name: Install universal2 Python from python.org
        run: |
          curl -fsSL -o python-installer.pkg \
            https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg python-installer.pkg -target /
          /Library/Frameworks/Python.framework/Versions/3.12/bin/python3 --version
          lipo -info /Library/Frameworks/Python.framework/Versions/3.12/bin/python3

      - name: Create virtual environment
        run: |
          /Library/Frameworks/Python.framework/Versions/3.12/bin/python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # No Homebrew step. Poppler and Tesseract are not used on macOS:
      # rendering ships inside the pypdfium2 wheel and OCR comes from the OS.

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Prepare universal2 dependencies
        run: python packaging/prepare_universal_deps.py

      - name: Build .app (universal2)
        run: python build.py

      - name: Verify universal2 and sign
        run: python packaging/verify_universal.py

      - name: Smoke test the built app
        run: |
          ./dist/QuickPdfOcr.app/Contents/MacOS/QuickPdfOcr \
            --selftest tests/fixtures/sample_invoice.pdf

      - name: Verify no Poppler or Tesseract in the bundle
        run: |
          if find dist/QuickPdfOcr.app \
               \( -name "*poppler*" -o -name "pdfinfo" -o -name "pdftoppm" \
                  -o -name "tesseract*" -o -name "*.traineddata" \) \
               -print | grep .; then
            echo "::error::External OCR binaries leaked into the bundle"
            exit 1
          fi
          echo "Bundle is clean"

      - name: Create ZIP archive
        run: |
          cd dist
          ditto -c -k --keepParent QuickPdfOcr.app QuickPdfOcr-macOS-universal2.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickPdfOcr-macOS-universal2
          path: dist/QuickPdfOcr-macOS-universal2.zip
          if-no-files-found: error

  publish:
    needs:
      - check-tag
      - build-windows
      - build-linux
      - build-macos-arm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist_assets
          merge-multiple: true

      - name: List assets
        run: ls -la dist_assets

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.check-tag.outputs.tag_name }}
          name: ${{ needs.check-tag.outputs.tag_name }}
          body: ${{ inputs.message }}
          artifacts: "dist_assets/*"
          commit: ${{ github.sha }}
          draft: true
          prerelease: false
          generateReleaseNotes: true
          immutableCreate: true
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
