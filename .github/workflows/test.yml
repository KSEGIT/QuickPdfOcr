name: Tests

# The release pipeline gates on the test suite, but nothing else ran it:
# a broken suite used to surface only when a release build failed. Run it
# on every PR and push to main so breakage is caught before it can block
# a release.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # Mirrors the Linux setup in create-release.yml: ubuntu-latest has no
      # libEGL for PySide6, and Tesseract is the OCR engine off macOS.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install Tesseract (Windows)
        if: runner.os == 'Windows'
        run: |
          winget install --id UB-Mannheim.TesseractOCR --disable-interactivity --force --silent --accept-source-agreements --accept-package-agreements
          # The installer does not update PATH for subsequent steps.
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Tesseract-OCR"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -v
