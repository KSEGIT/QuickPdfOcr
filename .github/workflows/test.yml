name: Tests

# The release pipeline gates on the test suite, but nothing else ran it:
# a broken suite used to surface only when a release build failed. Run it
# on every PR and push to main so breakage is caught before it can block
# a release.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # Mirrors the Linux setup in create-release.yml: ubuntu-latest has no
      # libEGL for PySide6, and Tesseract is the OCR engine off macOS.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install Tesseract (Windows)
        if: runner.os == 'Windows'
        run: |
          winget install --id UB-Mannheim.TesseractOCR --disable-interactivity --force --silent --accept-source-agreements --accept-package-agreements
          # The installer does not update PATH for subsequent steps.
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Tesseract-OCR"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -v

  browser-tests:
    # The matrix above installs only requirements.txt, so every
    # Playwright-backed guard -- the marketing-site rendering/contrast
    # checks in test_site_rendering.py, the ascii-icon colour-cascade check
    # in test_ascii_art.py, the hero-svg render checks in test_hero_svg.py,
    # and the icon-pipeline mapping/render checks in test_icon_outputs.py --
    # skips on every PR and push (`grep -rn 'playwright|requirements-assets'
    # .github/workflows/` found nothing before this job existed). Playwright
    # and Pillow are deliberately kept out of requirements.txt: they are
    # asset-authoring tooling, never a runtime dependency of the shipped
    # app. A single Ubuntu job is enough since these guards read a static
    # HTML file and rendered artefacts -- nothing platform-specific.
    #
    # Scoped to exactly these four files rather than `pytest tests/`: none
    # of them import PySide6/QApplication, so this job needs neither the Qt
    # system libraries nor Tesseract the matrix job installs, and running
    # the full suite here would otherwise just duplicate every OCR/PDF test
    # the matrix's own ubuntu-latest leg already covers, on every PR, for no
    # added coverage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r resources/requirements-assets.txt
          playwright install --with-deps chromium

      - name: Run browser-dependent tests
        run: |
          python -m pytest -v \
            tests/test_site_rendering.py \
            tests/test_ascii_art.py \
            tests/test_hero_svg.py \
            tests/test_icon_outputs.py
